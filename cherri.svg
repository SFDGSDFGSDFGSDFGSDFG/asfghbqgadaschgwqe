<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="fog1" cx="25%" cy="30%" r="55%">
      <stop offset="0" stop-color="#ff5c9a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5c9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog2" cx="80%" cy="75%" r="55%">
      <stop offset="0" stop-color="#b03a78" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b03a78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1e3"/>
      <stop offset="0.5" stop-color="#ff7fb0"/>
      <stop offset="1" stop-color="#e0407f"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background + fog -->
  <rect width="1280" height="720" fill="#120912"/>
  <g filter="url(#blur)">
    <ellipse cx="320" cy="220" rx="420" ry="260" fill="url(#fog1)"/>
    <ellipse cx="1020" cy="540" rx="420" ry="260" fill="url(#fog2)"/>
    <ellipse cx="640" cy="360" rx="300" ry="160" fill="#3a1630" opacity="0.5"/>
  </g>

  <!-- nav dock -->
  <g>
    <rect x="24" y="110" width="56" height="500" rx="28" fill="#241322" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- home / logo -->
    <circle cx="52" cy="146" r="11" fill="#ff5c9a"/>
    <path d="M52 135 q4 -6 8 -5" stroke="#7bd88f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="38" y1="172" x2="66" y2="172" stroke="#fff" stroke-opacity="0.12"/>

    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- games -->
      <rect x="40" y="190" width="24" height="14" rx="6"/>
      <line x1="47" y1="194" x2="47" y2="200"/><line x1="44" y1="197" x2="50" y2="197"/>
      <circle cx="57" cy="196" r="1"/><circle cx="60" cy="199" r="1"/>
      <!-- apps -->
      <rect x="41" y="232" width="8" height="8" rx="1.5"/><rect x="55" y="232" width="8" height="8" rx="1.5"/>
      <rect x="41" y="246" width="8" height="8" rx="1.5"/><rect x="55" y="246" width="8" height="8" rx="1.5"/>
      <!-- movies -->
      <rect x="40" y="290" width="24" height="16" rx="3"/>
      <path d="M49 294 l7 4 -7 4z"/>
      <!-- vms -->
      <rect x="40" y="338" width="24" height="15" rx="2"/>
      <line x1="46" y1="360" x2="58" y2="360"/><line x1="52" y1="353" x2="52" y2="360"/>
      <!-- ai -->
      <rect x="41" y="388" width="22" height="16" rx="4"/>
      <circle cx="47" cy="396" r="1.5"/><circle cx="57" cy="396" r="1.5"/>
      <line x1="52" y1="388" x2="52" y2="383"/>
      <!-- chat -->
      <path d="M40 436 h24 v14 h-14 l-6 5 v-5 h-4z"/>
    </g>
    <line x1="38" y1="478" x2="66" y2="478" stroke="#fff" stroke-opacity="0.12"/>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- partners -->
      <path d="M40 506 l8 -4 6 4 8 -4 v12 l-8 4 -6 -4 -8 4z"/>
      <!-- settings -->
      <circle cx="52" cy="548" r="4"/>
      <circle cx="52" cy="548" r="10" stroke-dasharray="4 3"/>
    </g>
    <!-- discord -->
    <circle cx="52" cy="590" r="12" fill="#5865F2"/>
    <circle cx="47" cy="590" r="2" fill="#fff"/><circle cx="57" cy="590" r="2" fill="#fff"/>
  </g>

  <!-- home content -->
  <g text-anchor="middle">
    <text x="640" y="305" font-size="112" font-weight="500" fill="url(#title)" filter="url(#glow)" letter-spacing="-2">cherri</text>
    <text x="640" y="345" font-size="18" font-weight="300" fill="#ffffff" fill-opacity="0.5">wsp</text>
  </g>

  <!-- search bar -->
  <g>
    <rect x="440" y="378" width="400" height="52" rx="26" fill="#241322" stroke="#ffffff" stroke-opacity="0.1"/>
    <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="473" cy="402" r="7"/><line x1="478" y1="407" x2="484" y2="413"/>
    </g>
    <text x="500" y="410" font-size="16" fill="#ffffff" fill-opacity="0.45">search anything...</text>
  </g>

  <!-- online users -->
  <text x="640" y="470" text-anchor="middle" font-size="14" fill="#ffffff" fill-opacity="0.5"><tspan font-weight="700" fill-opacity="0.8">0</tspan> users currently online</text>
</svg>
